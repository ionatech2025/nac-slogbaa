server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default is 1m — library PDFs and CMS images exceed that and nginx
    # returns 413 (or hangs the browser while discarding the extra bytes).
    client_max_body_size 32m;
    client_body_timeout 120s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://slogbaa-backend-uym55i:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        proxy_pass http://slogbaa-backend-uym55i:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
